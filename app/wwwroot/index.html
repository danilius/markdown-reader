<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Reader</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d1d9e0;
    --accent: #0969da;
    --tabbar-bg: #dfe3e8;
    --tab-bg: #cdd3da;
    --tab-active-bg: #ffffff;
    --tab-hover-bg: #e7ebef;
    --code-bg: #f6f8fa;
    --blockquote: #656d76;
    --thead-bg: #f6f8fa;
    --row-alt: #f6f8fa;
    --find-hit: rgba(255, 213, 0, .5);
    --find-current: #ff9632;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --accent: #4493f8;
      --tabbar-bg: #010409;
      --tab-bg: #161b22;
      --tab-active-bg: #0d1117;
      --tab-hover-bg: #21262d;
      --code-bg: #161b22;
      --blockquote: #8b949e;
      --thead-bg: #161b22;
      --row-alt: #161b22;
      --find-hit: rgba(210, 153, 34, .45);
      --find-current: #c46e0e;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial,
                 "Noto Sans Hebrew", "Segoe UI Historic", sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Tab bar ---------- */
  #tabbar {
    flex: 0 0 auto;
    display: flex; align-items: flex-end;
    background: var(--tabbar-bg);
    padding: 6px 8px 0 8px;
    gap: 2px;
    user-select: none;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 220px; min-width: 90px;
    padding: 7px 8px 7px 12px;
    background: var(--tab-bg);
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    flex: 0 1 auto;
  }
  .tab:hover { background: var(--tab-hover-bg); }
  .tab.active { background: var(--tab-active-bg); color: var(--fg); }
  .tab .title {
    overflow: hidden; text-overflow: ellipsis;
    direction: ltr; unicode-bidi: plaintext;
    flex: 1 1 auto;
  }
  .tab .close {
    flex: 0 0 auto;
    width: 18px; height: 18px; line-height: 16px;
    text-align: center; border-radius: 50%;
    font-size: 14px;
  }
  .tab .close:hover { background: rgba(128,128,128,.35); }
  #newtab-btn, #open-btn {
    flex: 0 0 auto;
    border: none; background: transparent; color: var(--muted);
    font-size: 17px; cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px;
    margin: 0 2px 3px 2px;
    font-family: inherit;
  }
  #newtab-btn:hover, #open-btn:hover { background: var(--tab-hover-bg); color: var(--fg); }

  /* ---------- Content ---------- */
  #panes { flex: 1 1 auto; position: relative; overflow: hidden; }
  .pane {
    position: absolute; inset: 0;
    display: none;
  }
  .pane.active { display: flex; flex-direction: row; }

  /* ---------- TOC sidebar ---------- */
  .toc {
    flex: 0 0 var(--toc-width, 250px);
    overflow-y: auto;
    border-inline-end: 1px solid var(--border);
    padding: 14px 10px 40px 14px;
    font-size: 13px;
    scrollbar-width: thin;
  }
  .pane.toc-hidden .toc, .pane.no-headings .toc { display: none; }
  .toc-resizer {
    flex: 0 0 5px;
    cursor: col-resize;
    background: transparent;
    margin-inline-start: -5px;   /* overlaps the TOC border so the grab area is generous */
    z-index: 6;
  }
  .toc-resizer:hover, .toc-resizer.dragging { background: var(--accent); opacity: .35; }
  .pane.toc-hidden .toc-resizer, .pane.no-headings .toc-resizer { display: none; }
  body.toc-resizing { cursor: col-resize; user-select: none; }
  .toc .toc-title {
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 8px 6px;
  }
  .toc a {
    display: block;
    color: var(--muted); text-decoration: none;
    padding: 3px 6px; border-radius: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    unicode-bidi: plaintext;
  }
  .toc a:hover { color: var(--fg); background: var(--tab-hover-bg); }
  .toc a.active { color: var(--accent); font-weight: 600; }
  .toc a.lvl2 { padding-inline-start: 20px; }
  .toc a.lvl3 { padding-inline-start: 34px; }
  .toc a.lvl4, .toc a.lvl5, .toc a.lvl6 { padding-inline-start: 48px; font-size: 12px; }

  .content { flex: 1 1 auto; overflow-y: auto; position: relative; }
  .doc {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 40px 80px 40px;
    font-size: 16px;
    line-height: 1.6;
    word-wrap: break-word;
  }

  /* ---------- Markdown styling (GitHub-like) ---------- */
  .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
    margin-top: 24px; margin-bottom: 16px;
    font-weight: 600; line-height: 1.25;
  }
  .doc h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .doc h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .doc h3 { font-size: 1.25em; }
  .doc h4 { font-size: 1em; }
  .doc h5 { font-size: .875em; }
  .doc h6 { font-size: .85em; color: var(--muted); }
  .doc p, .doc blockquote, .doc ul, .doc ol, .doc dl, .doc table, .doc pre {
    margin-top: 0; margin-bottom: 16px;
  }
  .doc a { color: var(--accent); text-decoration: none; }
  .doc a:hover { text-decoration: underline; }
  .doc blockquote {
    padding: 0 1em; color: var(--blockquote);
    border-inline-start: .25em solid var(--border);
    margin-inline: 0;
  }
  .doc ul, .doc ol { padding-inline-start: 2em; }
  .doc li + li { margin-top: .25em; }
  .doc hr {
    height: .25em; padding: 0; margin: 24px 0;
    background-color: var(--border); border: 0;
  }
  .doc table {
    border-spacing: 0; border-collapse: collapse;
    display: block; max-width: 100%; overflow-x: auto;
  }
  .doc th, .doc td {
    padding: 6px 13px; border: 1px solid var(--border);
  }
  .doc thead th { background: var(--thead-bg); font-weight: 600; }
  .doc tbody tr:nth-child(2n) { background: var(--row-alt); }
  .doc img { max-width: 100%; }
  .doc code, .doc pre {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    font-size: 85%;
  }
  .doc code {
    background: var(--code-bg);
    padding: .2em .4em; border-radius: 6px;
    direction: ltr; unicode-bidi: isolate;
  }
  .doc pre {
    background: var(--code-bg);
    padding: 16px; border-radius: 6px;
    overflow-x: auto; line-height: 1.45;
    direction: ltr;
  }
  .doc pre code { background: transparent; padding: 0; }
  .doc input[type="checkbox"] { margin-inline-end: .5em; }

  /* ---------- Find bar & highlights ---------- */
  #findbar {
    position: fixed; top: 76px; right: 28px; z-index: 60;
    display: flex; align-items: center; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  #findbar[hidden] { display: none; }
  #find-input {
    width: 200px;
    border: none; outline: none;
    background: transparent; color: var(--fg);
    font-size: 13px; font-family: inherit;
    padding: 2px 4px;
  }
  #find-count {
    font-size: 11.5px; color: var(--muted);
    min-width: 44px; text-align: center;
    white-space: nowrap;
  }
  #findbar button {
    border: none; background: transparent; color: var(--muted);
    width: 24px; height: 24px; border-radius: 5px;
    cursor: pointer; font-size: 12px; font-family: inherit;
  }
  #findbar button:hover { background: var(--tab-hover-bg); color: var(--fg); }
  ::highlight(search) { background-color: var(--find-hit); }
  ::highlight(search-current) { background-color: var(--find-current); color: #1f2328; }

  /* ---------- Welcome / empty state ---------- */
  .welcome {
    flex: 1 1 auto;
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 12px; text-align: center; padding: 24px;
  }
  .welcome .big { font-size: 40px; }
  .welcome h2 { margin: 0; font-weight: 500; color: var(--fg); }
  .welcome p { margin: 0; font-size: 14px; }
  .welcome kbd {
    background: var(--code-bg); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 6px; font-size: 12px; font-family: inherit;
  }
  .welcome button {
    margin-top: 8px; padding: 8px 20px;
    font-size: 14px; font-family: inherit;
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .welcome button:hover { filter: brightness(1.1); }

  /* ---------- Drag overlay ---------- */
  #drop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(9,105,218,.12);
    border: 3px dashed var(--accent);
    display: none;
    align-items: center; justify-content: center;
    font-size: 22px; color: var(--accent); font-weight: 600;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* ---------- File bar ---------- */
  .filebar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .filebar .path {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; direction: ltr; unicode-bidi: plaintext; text-align: start;
  }
  .filebar .live {
    flex: 0 0 auto; font-size: 11px;
    color: var(--accent);
  }
  .filebar button {
    flex: 0 0 auto;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 5px; cursor: pointer;
    font-size: 11.5px; padding: 2px 9px; font-family: inherit;
  }
  .filebar button:hover { color: var(--fg); border-color: var(--muted); }

  /* ---------- Print (used by Export to PDF) ---------- */
  @media print {
    html, body { height: auto; overflow: visible; display: block; }
    #tabbar, #findbar, #drop-overlay, .filebar, .toc, .toc-resizer { display: none !important; }
    #panes { position: static; overflow: visible; }
    .pane { display: none; }
    .pane.active { display: block; position: static; overflow: visible; }
    .content { overflow: visible; }
    .doc { padding: 0; max-width: none; }
    .doc pre { white-space: pre-wrap; overflow-x: visible; }
  }
</style>
</head>
<body>

<div id="tabbar">
  <button id="open-btn" title="Open file… (Ctrl+O)">&#128194;</button>
  <!-- tabs get inserted here -->
  <button id="newtab-btn" title="New tab — open file… (Ctrl+O)">+</button>
</div>
<div id="panes"></div>
<div id="findbar" hidden>
  <input id="find-input" type="text" placeholder="Find in document…" spellcheck="false">
  <span id="find-count"></span>
  <button id="find-prev" title="Previous match (Shift+Enter)">&#9650;</button>
  <button id="find-next" title="Next match (Enter)">&#9660;</button>
  <button id="find-close" title="Close (Esc)">&#215;</button>
</div>
<div id="drop-overlay">Drop Markdown files to open</div>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script>
(() => {
'use strict';

const host = window.chrome && window.chrome.webview;
const tabbar    = document.getElementById('tabbar');
const panes     = document.getElementById('panes');
const newtabBtn = document.getElementById('newtab-btn');
const openBtn   = document.getElementById('open-btn');
const dropOverlay = document.getElementById('drop-overlay');
const findbar   = document.getElementById('findbar');
const findInput = document.getElementById('find-input');
const findCount = document.getElementById('find-count');

marked.setOptions({ gfm: true, breaks: false });

let tabs = [];          // {id, path, name, tabEl, paneEl, contentEl, docEl, tocEl, headings}
let activeId = null;
let nextId = 1;
let tocVisible = true;  // global preference, persisted by the host
let tocWidth = 250;     // px, global preference, persisted by the host

function applyTocWidth() {
  document.documentElement.style.setProperty('--toc-width', tocWidth + 'px');
}

function send(msg) { if (host) host.postMessage(msg); }
function activeTab() { return tabs.find(t => t.id === activeId) || null; }

/* ---------- Session state → host (debounced) ---------- */

let stateTimer = null;
function sendStateSoon() {
  clearTimeout(stateTimer);
  stateTimer = setTimeout(sendState, 300);
}
function sendState() {
  clearTimeout(stateTimer);
  const active = activeTab();
  send({
    cmd: 'state',
    files: tabs.map(t => ({ path: t.path, scroll: t.contentEl.scrollTop })),
    activePath: active ? active.path : null,
    tocVisible,
    tocWidth,
  });
}

/* ---------- Rendering ---------- */

function renderMarkdown(text, basePath) {
  const rawHtml = marked.parse(text);
  const clean = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
  const doc = document.createElement('div');
  doc.className = 'doc';
  doc.innerHTML = clean;
  // The document stays dir="ltr" (like Chrome viewing the raw file); Hebrew
  // runs are handled inline by the Unicode bidi algorithm.
  doc.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (/^https?:|^mailto:/i.test(href)) {
      // External link — open in the default browser via the host.
      a.addEventListener('click', e => {
        e.preventDefault();
        send({ cmd: 'openExternal', url: href });
      });
    } else if (href.startsWith('#')) {
      // In-page anchor — default behavior is fine.
    } else {
      // Relative link — ask the host to open it as a new tab if it exists.
      a.addEventListener('click', e => {
        e.preventDefault();
        send({ cmd: 'openRelative', base: basePath, href });
      });
    }
  });
  return doc;
}

/* ---------- Tabs ---------- */

function findByPath(path) {
  return tabs.find(t => t.path.toLowerCase() === path.toLowerCase());
}

function openDocument({ path, name, text, scroll }) {
  const existing = findByPath(path);
  if (existing) {
    refreshTab(existing, text, /*keepScroll*/ true);
    activateTab(existing.id);
    return;
  }

  const id = nextId++;

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.title = path;
  const titleEl = document.createElement('span');
  titleEl.className = 'title';
  titleEl.textContent = name;
  const closeEl = document.createElement('span');
  closeEl.className = 'close';
  closeEl.textContent = '×';
  closeEl.title = 'Close tab';
  tabEl.append(titleEl, closeEl);
  tabbar.insertBefore(tabEl, newtabBtn);

  const paneEl = document.createElement('div');
  paneEl.className = 'pane';
  paneEl.classList.toggle('toc-hidden', !tocVisible);
  panes.appendChild(paneEl);

  const tab = { id, path, name, tabEl, paneEl,
                contentEl: null, docEl: null, tocEl: null, headings: [] };
  tabs.push(tab);

  fillPane(tab, text);
  hideWelcome();

  tabEl.addEventListener('click', e => {
    if (e.target === closeEl) closeTab(id);
    else activateTab(id);
  });
  tabEl.addEventListener('auxclick', e => {   // middle-click closes, like a browser
    if (e.button === 1) { e.preventDefault(); closeTab(id); }
  });

  activateTab(id);
  if (scroll) tab.contentEl.scrollTop = scroll;
  sendStateSoon();
}

function fillPane(tab, text) {
  tab.paneEl.replaceChildren();

  const tocEl = document.createElement('nav');
  tocEl.className = 'toc';

  const resizer = document.createElement('div');
  resizer.className = 'toc-resizer';
  resizer.title = 'Drag to resize; double-click to reset';
  attachTocResizer(resizer);

  const contentEl = document.createElement('div');
  contentEl.className = 'content';

  const bar = document.createElement('div');
  bar.className = 'filebar';
  const pathSpan = document.createElement('span');
  pathSpan.className = 'path';
  pathSpan.textContent = tab.path;
  const live = document.createElement('span');
  live.className = 'live';
  live.title = 'Reloads automatically when the file changes on disk';
  live.textContent = '● live';
  const tocBtn = document.createElement('button');
  tocBtn.textContent = '☰ TOC';
  tocBtn.title = 'Show/hide the table of contents (Ctrl+B)';
  tocBtn.addEventListener('click', toggleToc);
  const pdfBtn = document.createElement('button');
  pdfBtn.textContent = '⤓ PDF';
  pdfBtn.title = 'Export this document as PDF (Ctrl+P)';
  pdfBtn.addEventListener('click', () => send({ cmd: 'exportPdf', path: tab.path }));
  const reloadBtn = document.createElement('button');
  reloadBtn.textContent = '↻ Reload';
  reloadBtn.title = 'Re-read the file from disk now (Ctrl+R)';
  reloadBtn.addEventListener('click', () => send({ cmd: 'reload', path: tab.path }));
  bar.append(pathSpan, live, tocBtn, pdfBtn, reloadBtn);

  const docEl = renderMarkdown(text, tab.path);
  contentEl.append(bar, docEl);
  tab.paneEl.append(tocEl, resizer, contentEl);

  tab.tocEl = tocEl;
  tab.contentEl = contentEl;
  tab.docEl = docEl;

  contentEl.addEventListener('scroll', () => {
    sendStateSoon();
    updateTocActive(tab);
  });

  buildToc(tab);
  if (findbar.hidden === false && tab.id === activeId) runFind();
}

function refreshTab(tab, text, keepScroll) {
  const scroll = keepScroll ? tab.contentEl.scrollTop : 0;
  fillPane(tab, text);
  tab.contentEl.scrollTop = scroll;
}

function activateTab(id) {
  activeId = id;
  for (const t of tabs) {
    t.tabEl.classList.toggle('active', t.id === id);
    t.paneEl.classList.toggle('active', t.id === id);
  }
  if (!findbar.hidden) runFind();
  sendStateSoon();
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  const [tab] = tabs.splice(idx, 1);
  tab.tabEl.remove();
  tab.paneEl.remove();
  send({ cmd: 'closed', path: tab.path });
  if (activeId === id) {
    const next = tabs[idx] || tabs[idx - 1];
    if (next) activateTab(next.id);
    else { activeId = null; closeFind(); showWelcome(); }
  }
  sendStateSoon();
}

/* ---------- Table of contents ---------- */

function slugify(text) {
  return text.toLowerCase().trim()
    .replace(/[^\p{L}\p{N}\s-]/gu, '')
    .replace(/\s+/g, '-') || 'section';
}

function buildToc(tab) {
  const headings = [...tab.docEl.querySelectorAll('h1, h2, h3, h4, h5, h6')];
  tab.headings = [];
  tab.tocEl.replaceChildren();

  if (headings.length < 2) {
    tab.paneEl.classList.add('no-headings');
    return;
  }
  tab.paneEl.classList.remove('no-headings');

  const title = document.createElement('div');
  title.className = 'toc-title';
  title.textContent = 'Contents';
  tab.tocEl.appendChild(title);

  const used = new Set();
  for (const h of headings) {
    if (!h.id) {
      let s = slugify(h.textContent);
      let n = 1;
      while (used.has(s)) s = slugify(h.textContent) + '-' + (++n);
      h.id = s;
    }
    used.add(h.id);

    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'lvl' + h.tagName[1];
    a.textContent = h.textContent;
    a.title = h.textContent;
    a.addEventListener('click', e => {
      e.preventDefault();
      const top = h.getBoundingClientRect().top
                - tab.contentEl.getBoundingClientRect().top
                + tab.contentEl.scrollTop - 44;   // clear the sticky filebar
      tab.contentEl.scrollTo({ top, behavior: 'smooth' });
    });
    tab.tocEl.appendChild(a);
    tab.headings.push({ h, a });
  }
  updateTocActive(tab);
}

function updateTocActive(tab) {
  if (!tab.headings.length) return;
  const contentTop = tab.contentEl.getBoundingClientRect().top;
  let current = tab.headings[0];
  for (const entry of tab.headings) {
    if (entry.h.getBoundingClientRect().top - contentTop <= 52) current = entry;
    else break;
  }
  for (const entry of tab.headings)
    entry.a.classList.toggle('active', entry === current);
}

function attachTocResizer(resizer) {
  resizer.addEventListener('pointerdown', e => {
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    resizer.classList.add('dragging');
    document.body.classList.add('toc-resizing');
    const startX = e.clientX;
    const startWidth = tocWidth;

    const onMove = ev => {
      tocWidth = Math.min(600, Math.max(140, startWidth + (ev.clientX - startX)));
      applyTocWidth();
    };
    const onUp = ev => {
      resizer.releasePointerCapture(e.pointerId);
      resizer.classList.remove('dragging');
      document.body.classList.remove('toc-resizing');
      resizer.removeEventListener('pointermove', onMove);
      resizer.removeEventListener('pointerup', onUp);
      resizer.removeEventListener('pointercancel', onUp);
      sendStateSoon();
    };
    resizer.addEventListener('pointermove', onMove);
    resizer.addEventListener('pointerup', onUp);
    resizer.addEventListener('pointercancel', onUp);
  });
  resizer.addEventListener('dblclick', () => {
    tocWidth = 250;
    applyTocWidth();
    sendStateSoon();
  });
}

function toggleToc() {
  tocVisible = !tocVisible;
  for (const t of tabs) t.paneEl.classList.toggle('toc-hidden', !tocVisible);
  sendStateSoon();
}

/* ---------- Find in document ---------- */

let findRanges = [];
let findIndex = -1;

function openFind() {
  findbar.hidden = false;
  findInput.focus();
  findInput.select();
  if (findInput.value) runFind();
}

function closeFind() {
  findbar.hidden = true;
  clearFindHighlights();
}

function clearFindHighlights() {
  if (window.CSS && CSS.highlights) {
    CSS.highlights.delete('search');
    CSS.highlights.delete('search-current');
  }
  findRanges = [];
  findIndex = -1;
  findCount.textContent = '';
}

function collectRanges(root, query) {
  const q = query.toLowerCase();
  const ranges = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    const text = node.nodeValue.toLowerCase();
    let pos = 0, hit;
    while ((hit = text.indexOf(q, pos)) !== -1) {
      const range = new Range();
      range.setStart(node, hit);
      range.setEnd(node, hit + q.length);
      ranges.push(range);
      pos = hit + q.length;
    }
  }
  return ranges;
}

function runFind() {
  clearFindHighlights();
  const tab = activeTab();
  const query = findInput.value;
  if (!tab || !query || !(window.CSS && CSS.highlights)) return;

  findRanges = collectRanges(tab.docEl, query);
  if (!findRanges.length) {
    findCount.textContent = '0/0';
    return;
  }
  CSS.highlights.set('search', new Highlight(...findRanges));

  // Start from the first match at or below the current scroll position.
  const contentTop = tab.contentEl.getBoundingClientRect().top;
  let start = findRanges.findIndex(r => r.getBoundingClientRect().bottom >= contentTop);
  setCurrentMatch(start === -1 ? 0 : start);
}

function setCurrentMatch(i) {
  const tab = activeTab();
  if (!tab || !findRanges.length) return;
  findIndex = (i + findRanges.length) % findRanges.length;
  const range = findRanges[findIndex];
  CSS.highlights.set('search-current', new Highlight(range));
  findCount.textContent = (findIndex + 1) + '/' + findRanges.length;

  const rect = range.getBoundingClientRect();
  const contentRect = tab.contentEl.getBoundingClientRect();
  if (rect.top < contentRect.top + 60 || rect.bottom > contentRect.bottom - 20) {
    tab.contentEl.scrollBy({
      top: rect.top - contentRect.top - tab.contentEl.clientHeight / 2,
    });
  }
}

findInput.addEventListener('input', runFind);
findInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    setCurrentMatch(findIndex + (e.shiftKey ? -1 : 1));
  }
  if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
document.getElementById('find-next').addEventListener('click', () => setCurrentMatch(findIndex + 1));
document.getElementById('find-prev').addEventListener('click', () => setCurrentMatch(findIndex - 1));
document.getElementById('find-close').addEventListener('click', closeFind);

/* ---------- Welcome screen ---------- */

let welcomePane = null;
function showWelcome() {
  if (!welcomePane) {
    welcomePane = document.createElement('div');
    welcomePane.className = 'pane';
    welcomePane.innerHTML = `
      <div class="welcome">
        <div class="big">&#128220;</div>
        <h2>Markdown Reader</h2>
        <p>Drag Markdown files anywhere in this window,<br>
           or press <kbd>Ctrl</kbd>+<kbd>O</kbd> to browse.</p>
        <button id="welcome-open">Open file&hellip;</button>
      </div>`;
    panes.appendChild(welcomePane);
    welcomePane.querySelector('#welcome-open').addEventListener('click',
      () => send({ cmd: 'openDialog' }));
  }
  welcomePane.classList.add('active');
}
function hideWelcome() {
  if (welcomePane) welcomePane.classList.remove('active');
}

/* ---------- Messages from the host ---------- */

if (host) {
  host.addEventListener('message', e => {
    const m = e.data;
    if (!m || !m.type) return;
    switch (m.type) {
      case 'open':
        openDocument(m);
        break;
      case 'changed': {
        const tab = findByPath(m.path);
        if (tab) refreshTab(tab, m.text, /*keepScroll*/ true);
        break;
      }
      case 'activate': {
        const tab = findByPath(m.path);
        if (tab) activateTab(tab.id);
        break;
      }
      case 'prefs':
        tocVisible = m.tocVisible !== false;
        if (typeof m.tocWidth === 'number' && m.tocWidth >= 140 && m.tocWidth <= 600)
          tocWidth = m.tocWidth;
        applyTocWidth();
        for (const t of tabs) t.paneEl.classList.toggle('toc-hidden', !tocVisible);
        break;
    }
  });
}

openBtn.addEventListener('click', () => send({ cmd: 'openDialog' }));
newtabBtn.addEventListener('click', () => send({ cmd: 'openDialog' }));

/* ---------- Drag & drop ---------- */
/* The drop lands in the page; postMessageWithAdditionalObjects hands the
   DOM File objects to the host, where they surface with real disk paths. */

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    dragDepth++;
    dropOverlay.classList.add('show');
  }
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); }
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove('show');
  const files = e.dataTransfer ? e.dataTransfer.files : null;
  if (host && files && files.length)
    host.postMessageWithAdditionalObjects({ cmd: 'drop' }, [...files]);
});

/* ---------- Keyboard shortcuts ---------- */

window.addEventListener('keydown', e => {
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'o') {
    e.preventDefault();
    send({ cmd: 'openDialog' });
  }
  if (e.ctrlKey && e.key === 'Tab') {
    e.preventDefault();
    if (tabs.length < 2) return;
    const idx = tabs.findIndex(t => t.id === activeId);
    const next = e.shiftKey
      ? tabs[(idx - 1 + tabs.length) % tabs.length]
      : tabs[(idx + 1) % tabs.length];
    activateTab(next.id);
  }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'r') {
    e.preventDefault();
    const tab = activeTab();
    if (tab) send({ cmd: 'reload', path: tab.path });
  }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'w') {
    e.preventDefault();
    if (activeId !== null) closeTab(activeId);
  }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    if (activeTab()) openFind();
  }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    if (activeTab()) toggleToc();
  }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'p') {
    e.preventDefault();
    const tab = activeTab();
    if (tab) send({ cmd: 'exportPdf', path: tab.path });
  }
  if (e.key === 'Escape' && !findbar.hidden) {
    closeFind();
  }
});

/* Flush latest scroll state when the window is about to go away. */
window.addEventListener('pagehide', sendState);

showWelcome();
send({ cmd: 'ready' });
})();
</script>
</body>
</html>
